  <!-- glass neck + bulb -->
  <path d="M54 30 V52 C 36 58 28 70 28 82 C 28 104 44 118 64 118 C 84 118 100 104 100 82 C 100 70 92 58 74 52 V30 Z" fill="#cfe9f5" fill-opacity=".35" stroke="#e8f6ff" stroke-width="3" stroke-linejoin="round"/>
